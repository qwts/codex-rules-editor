name: CI
run-name: CI ${{ github.event_name == 'workflow_dispatch' && format('purpose={0}', inputs.purpose) || 'lifecycle' }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      purpose:
        description: Why the complete suite is being run manually
        required: true
        type: choice
        options:
          - exact-sha-preflight
          - diagnostics
          - release-recovery
          - workflow-testing
          - explicit-rerun

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && format('merge-group-{0}', github.event.merge_group.head_ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  policy:
    name: Action Policy
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.policy.outputs.mode || steps.merge_queue_policy.outputs.mode }}
      run_full: ${{ steps.policy.outputs.run_full || steps.merge_queue_policy.outputs.run_full }}
      run_post_merge: ${{ steps.policy.outputs.run_post_merge || steps.merge_queue_policy.outputs.run_post_merge }}
    steps:
      - id: policy
        name: Enforce immutable actor and fork policy
        if: github.event_name != 'merge_group'
        uses: qwts/playbook-engineering/.github/actions/ci-policy@060c1fae87a9297f6480a9fdd3a4e7741bb92e80
        env:
          CI_POLICY_ACTOR: ${{ github.actor }}
          CI_POLICY_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      - id: merge_queue_policy
        name: Enforce immutable merge queue actor policy
        if: github.event_name == 'merge_group'
        env:
          CI_POLICY_ACTOR: ${{ github.actor }}
          CI_POLICY_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          CI_POLICY_ACTION: ${{ github.event.action }}
          CI_POLICY_BASE_REF: ${{ github.event.merge_group.base_ref }}
          CI_POLICY_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          test "$CI_POLICY_ACTOR" = 'github-merge-queue[bot]'
          test "$CI_POLICY_TRIGGERING_ACTOR" = 'github-merge-queue[bot]'
          test "$CI_POLICY_ACTION" = checks_requested
          test "$CI_POLICY_BASE_REF" = refs/heads/main
          case "$CI_POLICY_HEAD_REF" in
            refs/heads/gh-readonly-queue/main/*) ;;
            *) exit 1 ;;
          esac
          printf 'mode=queue\nrun_full=true\nrun_post_merge=false\n' >> "$GITHUB_OUTPUT"

  merge-evidence:
    name: Verify exact main evidence
    needs: policy
    if: needs.policy.outputs.run_post_merge == 'true'
    runs-on: ubuntu-latest
    outputs:
      validated: ${{ steps.evidence.outputs.validated }}
    steps:
      - id: evidence
        name: Find successful merge-group evidence for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.name == "CI" and .event == "merge_group" and .conclusion == "success") | .id) // empty')
          validated=false
          if [ -n "$run_id" ]; then
            validated=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
              --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          fi
          echo "validated=$validated" >> "$GITHUB_OUTPUT"

  preflight-evidence:
    name: Verify exact PR-head preflight
    needs: policy
    if: github.event_name == 'pull_request' && needs.policy.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    outputs:
      validated: ${{ steps.evidence.outputs.validated }}
    steps:
      - id: evidence
        name: Find successful manual complete suite for the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&head_sha=$TARGET_SHA&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.name == "CI" and .path == ".github/workflows/ci.yml" and .display_title == "CI purpose=exact-sha-preflight" and .conclusion == "success") | .id) // empty')
          validated=false
          if [ -n "$run_id" ]; then
            validated=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
              --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          fi
          echo "validated=$validated" >> "$GITHUB_OUTPUT"

  complete:
    name: Complete suite
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      always() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run repository validation contract
        run: npm run validate
      - name: Run pinned actionlint
        run: npm run lint:workflows

  codeql:
    name: Advanced CodeQL
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      always() && needs.policy.result == 'success' &&
      (needs.policy.outputs.run_post_merge == 'true' ||
      (needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true'))
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  gate:
    name: CI
    needs: [policy, merge-evidence, preflight-evidence, complete, codeql]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Enforce the selected lifecycle lane
        env:
          MODE: ${{ needs.policy.outputs.mode }}
          POLICY: ${{ needs.policy.result }}
          COMPLETE: ${{ needs.complete.result }}
          CODEQL: ${{ needs.codeql.result }}
          PREFLIGHT: ${{ needs.preflight-evidence.result }}
          PREFLIGHT_VALIDATED: ${{ needs.preflight-evidence.outputs.validated }}
          MERGE_VALIDATED: ${{ needs.merge-evidence.outputs.validated }}
        run: |
          test "$POLICY" = success
          case "$MODE" in
            full)
              if [ "$PREFLIGHT_VALIDATED" = true ]; then
                test "$PREFLIGHT" = success
              else
                test "$COMPLETE" = success
                test "$CODEQL" = success
              fi
              ;;
            queue|manual)
              test "$COMPLETE" = success
              test "$CODEQL" = success
              ;;
            post-merge)
              test "$CODEQL" = success
              if [ "$MERGE_VALIDATED" = true ]; then
                true
              else
                test "$COMPLETE" = success
              fi
              ;;
            *) exit 1 ;;
          esac
